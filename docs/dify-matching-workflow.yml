            "selected": false,
            "code_language": "javascript",
            "code": "function main({text,allowed_json}){const v=JSON.parse(text.trim().replace(/^<think>[\\s\\S]*?<\\/think>\\s*/i,'').replace(/^```(?:json)?\\s*/i,'').replace(/\\s*```$/,''));if(!v||!Array.isArray(v.matches)||v.matches.length>24)throw Error('Invalid match response');const map=new Map(JSON.parse(allowed_json).map(c=>[c.id,c])),seen=new Set(),out=[];const norm=t=>t.normalize('NFKC').replace(/\\s+/g,' ').trim();for(const m of v.matches){const c=map.get(m.candidateId);if(!c||seen.has(m.candidateId))throw Error('Unknown candidate');seen.add(m.candidateId);if(!Number.isFinite(m.score)||m.score<0||m.score>100||typeof m.reason!=='string'||!m.reason.trim()||m.reason.length>400||typeof m.evidence!=='string'||m.evidence.trim().length<2||m.evidence.length>240)throw Error('Invalid evidence');const source=norm(c.skills.join(' ')+' '+c.skillDescription);if(!source.includes(norm(m.evidence)))throw Error('Evidence not in candidate skills');if(m.score>=65)out.push({candidateId:m.candidateId,score:Math.round(m.score),reason:m.reason.trim(),evidence:m.evidence.trim()});}out.sort((a,b)=>b.score-a.score);return {matches_json:JSON.stringify(out)};}",
