    - data:
        code: "import json, re\n\ndef main(arg1: str) -> dict:\n    text = re.sub(r'<think>[\\\
          s\\S]*?</think>', '', arg1).strip()\n    text = re.sub(r'^```(?:json)?\\\
          s*|\\s*```$', '', text, flags=re.I).strip()\n    obj = json.loads(text)\n\
          \    if not isinstance(obj, dict) or set(obj) != {'pageTitle', 'observedText',\
          \ 'verdict', 'issues', 'limitations'}:\n        raise ValueError('Invalid\
          \ result fields')\n    for key, limit in [('pageTitle', 300), ('observedText',\
          \ 3000)]:\n        if not isinstance(obj[key], str) or len(obj[key]) > limit:\n\
          \            raise ValueError('Invalid ' + key)\n    if obj['verdict'] not\
          \ in ('pass', 'revise', 'unreadable'):\n        raise ValueError('Invalid\
          \ verdict')\n    for key in ('issues', 'limitations'):\n        if not isinstance(obj[key],\
          \ list) or len(obj[key]) > 20 or any(not isinstance(x, str) or not x.strip()\
          \ or len(x) > 500 for x in obj[key]):\n            raise ValueError('Invalid\
          \ ' + key)\n    if obj['verdict'] == 'pass' and (obj['issues'] or not obj['pageTitle'].strip()\
          \ or not obj['observedText'].strip()):\n        raise ValueError('Pass requires\
          \ observed title and text without issues')\n    if obj['verdict'] == 'revise'\
          \ and not obj['issues']:\n        raise ValueError('Revise requires issues')\n\
          \    if obj['verdict'] == 'unreadable' and not obj['limitations']:\n   \
          \     raise ValueError('Unreadable requires limitations')\n    return {'result_json':\
          \ json.dumps(obj, ensure_ascii=False)}\n"
        code_language: python3
