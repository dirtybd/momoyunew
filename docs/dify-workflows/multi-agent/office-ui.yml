      config_note: "## 环境事实（本轮只读诊断实测，2025 本轮 Build 会话）\n\n本轮**未安装、未升级、未删除任何包**，也未修改提示词、工具或工作区文件；以下仅为实测结论，供后续\
        \ run 直接引用。\n\n### 沙箱形态\n- `$HOME` 为**每次 run 独立**目录：`/home/dify/<run-id>`（本轮\
        \ `01a1a963-f48b-701e-8540-4476c70731bf`）。\n- 工作目录为另一路径：`/workspace/<run-id>`，与\
        \ `$HOME` 不同，且本轮为空（无 `context_file`、无原件）。\n- 结论：不能假设上一轮的工作文件仍在；续改文档必须从 context_file\
        \ 的 `outputHistory` 里取真实 `tool_file` 引用下载。\n\n### Python 运行环境（直接可用）\n- 解释器：`$HOME/.venv-office/bin/python`\
        \ → `python3`，Python **3.13.17**。\n- `pyvenv.cfg`：`home = /usr/local/bin`；`include-system-site-packages\
        \ = false`。\n- 实测可导入（`import docx, openpyxl, pypdf, PIL, reportlab` → 输出 `OFFICE_IMPORTS_OK`，exit\
        \ 0）：\n  - python-docx 1.2.0\n  - openpyxl 3.1.5\n  - pypdf 6.21.4\n  - Pillow\
        \ 13.0.0\n  - reportlab 5.1.0\n- **用法**：文件任务一律用 `\"$HOME/.venv-office/bin/python\"\
        \ <脚本>` 运行，直接复用上述依赖，**不要 pip install、不要重建 venv**。\n- **系统 Python 不可用于文档任务**：`/usr/local/bin/python3`（同为\
        \ 3.13.17）中 `docx`/`openpyxl`/`pptx` 均缺失。\n\n### 判定环境是否就绪的注意点\n同一 HOME 下曾出现首次\
        \ `ls` 为空、`find -name pyvenv.cfg` 无结果，随后同路径 `.venv-office` 出现的情况（`pyvenv.cfg`\
        \ 内 `command` 记录的是**另一个 run 的 HOME**，目录 mtime 早于会话）。属预置环境挂载/供应时序，不是本轮创建。\n\
        因此：**判断环境可用性以实际 `-c \"import ...\"` 结果为准，绝不仅凭一次 `ls` 就重装依赖或重建 venv。**\n\n\
        ### 渲染\n- `soffice`：`/usr/bin/soffice`；LibreOffice 库目录 `/usr/lib/libreoffice`\
        \ 存在，可直接用于 docx→PDF→PNG 渲染校验，无需安装。\n\n### 待办\n- 无。无待完成认证、无需要用户执行的操作；后续 run\
        \ 无需再重复探测上述环境。\n"
