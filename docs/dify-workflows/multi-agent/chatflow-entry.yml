            "desc": "",
            "code_language": "javascript",
            "code": "function main({text,route_context}){\n    const hints=JSON.parse(route_context);\n    if(hints.careSafety==='urgent')return {route:'care'};\n    const clean=text.trim().replace(/^(?:<think>[\\s\\S]*?<\\/think>\\s*)+/i,'').replace(/^\\x60\\x60\\x60(?:json)?\\s*/i,'').replace(/\\s*\\x60\\x60\\x60$/,'');\n    const value=JSON.parse(clean);\n    if(!value||Object.keys(value).length!==1||!['office','card','care','office_chat'].includes(value.route))throw Error('路由结果无效');\n    return {route:value.route==='office_chat'&&(hints.hasMaterials||hints.hasOutputs)?'office':value.route};\n  }",
