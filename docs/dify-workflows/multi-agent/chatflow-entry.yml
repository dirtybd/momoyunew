            "code": "function main({data,files}){\n    if(!Array.isArray(data)||data.length!==1||!data[0]||typeof data[0].answer_json!=='string'||typeof data[0].artifact_json!=='string')throw Error('专业工作流结果无效');\n    const result=JSON.parse(data[0].answer_json);\n    if(!result||typeof result.reply!=='string'||typeof result.readyForPreview!=='boolean')throw Error('专业助手回复无效');\n    const actualFiles=files||[];\n    if(!Array.isArray(actualFiles)||actualFiles.length>5)throw Error('成果文件过多');\n    if('office'==='care'&&(result.intent!=='care'||actualFiles.length||data[0].artifact_json!==''))throw Error('情感助手结果越界');\n    return {packet:JSON.stringify({version:1,route:'office',answer_json:data[0].answer_json,files:actualFiles,artifact_json:data[0].artifact_json})};\n  }",
