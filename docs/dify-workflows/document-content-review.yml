          "data": {
            "type": "code",
            "title": "严格结构与能力边界校验",
            "desc": "",
            "selected": false,
            "code_language": "javascript",
            "code": "function main({text}){const bad=()=>{throw Error('文档工作流输出格式无效')},str=(x,n)=>typeof x==='string'&&x.trim().length>0&&x.length<=n,arr=(x,n)=>Array.isArray(x)&&x.length<=n,list=(x,n,m)=>arr(x,n)&&x.every(s=>str(s,m)),keys=(x,ks)=>x&&typeof x==='object'&&!Array.isArray(x)&&Object.keys(x).length===ks.length&&ks.every(k=>Object.hasOwn(x,k));if(typeof text!=='string'||text.length>60000)bad();const v=JSON.parse(text.trim().replace(/^(?:<think>[\\s\\S]*?<\\/think>\\s*)+/i,'').replace(/^```(?:json)?\\s*/i,'').replace(/\\s*```$/,''));if(!keys(v,[\"verdict\",\"scope\",\"visualVerified\",\"issues\",\"summary\"]))bad();if(!['no_content_issue_found','revise','insufficient_source'].includes(v.verdict)||v.scope!=='content_only'||v.visualVerified!==false||!arr(v.issues,24)||!v.issues.every(s=>keys(s,['severity','location','issue','suggestion'])&&['error','warning'].includes(s.severity)&&str(s.location,300)&&str(s.issue,800)&&str(s.suggestion,1000))||!str(v.summary,1500)||(v.verdict==='no_content_issue_found'&&v.issues.length)||(v.verdict==='revise'&&!v.issues.length))bad();return {result_json:JSON.stringify(v)}}",
