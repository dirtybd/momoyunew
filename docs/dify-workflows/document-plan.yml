          "data": {
            "type": "code",
            "title": "严格结构与能力边界校验",
            "desc": "",
            "selected": false,
            "code_language": "javascript",
            "code": "function main({text}){const bad=()=>{throw Error('文档工作流输出格式无效')},str=(x,n)=>typeof x==='string'&&x.trim().length>0&&x.length<=n,arr=(x,n)=>Array.isArray(x)&&x.length<=n,list=(x,n,m)=>arr(x,n)&&x.every(s=>str(s,m)),keys=(x,ks)=>x&&typeof x==='object'&&!Array.isArray(x)&&Object.keys(x).length===ks.length&&ks.every(k=>Object.hasOwn(x,k));if(typeof text!=='string'||text.length>60000)bad();const v=JSON.parse(text.trim().replace(/^(?:<think>[\\s\\S]*?<\\/think>\\s*)+/i,'').replace(/^```(?:json)?\\s*/i,'').replace(/\\s*```$/,''));if(!keys(v,[\"status\",\"title\",\"format\",\"sections\",\"missingFields\",\"questions\",\"layout\",\"checks\"]))bad();if(!['ready','needs_clarification'].includes(v.status)||!str(v.title,200)||!['docx','xlsx','pptx'].includes(v.format)||!arr(v.sections,16)||!v.sections.length||!v.sections.every(s=>keys(s,['heading','kind','fields','instructions'])&&str(s.heading,200)&&['prose','table','attachment'].includes(s.kind)&&list(s.fields,40,200)&&str(s.instructions,2000))||!list(v.missingFields,60,200)||!list(v.questions,3,500)||!keys(v.layout,['pageSize','orientation','latinFont','cjkFont'])||!['A4','Letter','follow_template'].includes(v.layout.pageSize)||!['portrait','landscape'].includes(v.layout.orientation)||!str(v.layout.latinFont,100)||!str(v.layout.cjkFont,100)||!list(v.checks,24,500))bad();if(v.status==='needs_clarification'&&!v.questions.length)bad();if(v.status==='ready'&&v.questions.length)bad();return {result_json:JSON.stringify(v)}}",
