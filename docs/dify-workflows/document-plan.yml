            "title": "摸摸鱼·文档设计规划",
            "desc": "",
            "selected": false,
            "model": {
              "provider": "langgenius/openai_api_compatible/openai_api_compatible",
              "name": "momoyu-card-qwen-fast-20261113",
              "mode": "chat",
              "completion_params": {
                "temperature": 0.1,
                "max_tokens": 16384,
                "enable_thinking": false
