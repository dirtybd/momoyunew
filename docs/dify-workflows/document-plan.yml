            "type": "code",
            "title": "输入范围校验",
            "desc": "",
            "selected": false,
            "code_language": "javascript",
            "code": "function main({task_json}){if(typeof task_json!=='string'||task_json.length>60000)throw Error('输入过长');const v=JSON.parse(task_json),keys=['goal','source_text','draft_text','template_notes','format','constraints'];if(!v||typeof v!=='object'||Array.isArray(v)||Object.keys(v).some(k=>!keys.includes(k)))throw Error('输入字段无效');if(typeof v.goal!=='string'||!v.goal.trim()||v.goal.length>4000)throw Error('请填写具体目标');for(const k of ['source_text','draft_text','template_notes'])if(v[k]!==undefined&&(typeof v[k]!=='string'||v[k].length>(k==='template_notes'?2000:24000)))throw Error('材料文字过长或格式无效');if(v.format!==undefined&&!['docx','xlsx','pptx'].includes(v.format))throw Error('格式无效');if(v.constraints!==undefined&&(!Array.isArray(v.constraints)||v.constraints.length>16||v.constraints.some(s=>typeof s!=='string'||s.length>400)))throw Error('约束格式无效');return {task_json:JSON.stringify(v)}}",
