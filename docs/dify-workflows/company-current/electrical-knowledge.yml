    - data:
        code: "def main(result: list) -> dict:\n    parts, names = [], []\n    if\
          \ isinstance(result, list):\n        for r in result:\n            md =\
          \ r.get(\"metadata\") or {}\n            name = r.get(\"title\") or md.get(\"\
          document_name\") or \"未命名文档\"\n            if name not in names:\n     \
          \           names.append(name)\n            parts.append(f\"【来源：{name}】\\\
          n{(r.get('content') or '').strip()}\")\n    return {\n        \"sources\"\
          : \"、\".join(names) or \"\"\n    }\n"
