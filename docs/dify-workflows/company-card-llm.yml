    - data:
        code: "function main({text}){\n let value=text.trim();const fence=String.fromCharCode(96).repeat(3);\n\
          \ if(value.startsWith(fence)&&value.endsWith(fence)){value=value.slice(3,-3).trim();if(value.toLowerCase().startsWith('json'))value=value.slice(4).trim();}\n\
          \ const result=JSON.parse(value),allowed=['reply','card','cardStyle','coverAttachmentId'];\n\
          \ if(!result||Array.isArray(result)||typeof result.reply!=='string'||!result.reply.trim()||result.reply.length>12000||Object.keys(result).some(k=>!allowed.includes(k)))throw\
          \ Error('卡片答复格式无效');\n const card=result.card??null;\n if(card!==null){\n\
          \  const strings={title:200,problem:2000,desiredOutcome:2000},arrays=['deliverables','acceptanceCriteria','materials','constraints','skills'];\n\
          \  if(typeof card!=='object'||Array.isArray(card)||Object.keys(card).some(k=>!Object.hasOwn(strings,k)&&!arrays.includes(k)&&k!=='deadline'))throw\
          \ Error('卡片字段无效');\n  for(const k of Object.keys(strings))if(card[k]!==undefined&&(typeof\
          \ card[k]!=='string'||card[k].length>strings[k]))throw Error('卡片文字字段无效');\n\
          \  for(const k of arrays)if(card[k]!==undefined&&(!Array.isArray(card[k])||card[k].length>20||card[k].some(x=>typeof\
          \ x!=='string'||x.length>500)))throw Error('卡片列表字段无效');\n  if(card.deadline!==undefined&&card.deadline!==null&&(typeof\
          \ card.deadline!=='string'||card.deadline.length>100))throw Error('卡片时间字段无效');\n\
          \ }\n return {answer_json:JSON.stringify({...result,card}),deliverables:[],artifact_json:''};\n\
