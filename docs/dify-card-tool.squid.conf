# Only these authenticated, short-lived job endpoints are reachable.
acl momoyu_card_host dstdomain host.docker.internal
acl momoyu_card_port port 8792
acl momoyu_card_path urlpath_regex ^/design-card$
acl momoyu_card_method method POST
http_access allow client_localnet momoyu_card_host momoyu_card_port momoyu_card_path momoyu_card_method
acl momoyu_match_path urlpath_regex ^/match-preview$
http_access allow client_localnet momoyu_card_host momoyu_card_port momoyu_match_path momoyu_card_method
